name: External IP probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/external-ip-probe.yml'
      - 'frontend/e2e-live/smoke.mjs'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check public edge from independent network
        shell: bash
        run: |
          set -euo pipefail
          ip=$(curl -4 -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | sed -n 's/^ip=//p')
          test -n "$ip"
          digest=$(printf '%s' "$ip" | sha256sum | cut -d' ' -f1)
          code=$(curl -4 -fsS --max-time 15 -o /dev/null -w '%{http_code}' \
            -H 'X-Forwarded-For: 203.0.113.123' \
            -H 'Forwarded: for=203.0.113.124' \
            -H 'X-Opencigan-Client-IP: 203.0.113.125' \
            https://opencigan.mcv.kr/api/v1/status)
          test "$code" = 200
          echo "Runner egress IP SHA-256: $digest"
          date -u '+Request completed at %Y-%m-%dT%H:%M:%SZ'
  live-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node e2e-live/smoke.mjs
        working-directory: frontend
