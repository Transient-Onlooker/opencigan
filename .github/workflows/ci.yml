name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s clients/python/tests -v
      - run: python -m unittest test_worker test_d1_cache test_migration -v
        working-directory: workers-api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --experimental-strip-types clients/ts/tests/client.test.ts
      - run: node --test cloudflare-gateway/test/*.test.mjs
      - run: python -m unittest discover -s tests/integration -v
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - run: npx playwright test e2e/suggestions.spec.js
        working-directory: frontend
        env:
          VITE_SUGGESTIONS_ENABLED: '1'
      - run: npx playwright test e2e/history-stats.spec.js
        working-directory: frontend
        env:
          VITE_HISTORY_STATS_ENABLED: '1'
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: frontend/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
