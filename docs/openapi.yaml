openapi: 3.1.0
info:
  title: Opensigan API
  version: 1.0.0
  description: |-
    School timetable, school search, and meal data. All examples are synthetic.
    Responses from cached data include `stale`; the timetable endpoint also
    returns `cacheStatus` (`hit`, `miss`, or `stale`). The history endpoint returns
    observed timetable changes in cursor-paginated form.
servers:
  - url: /
    description: Same origin as the documentation page; relative requests only.
tags:
  - name: System
  - name: Schools
  - name: Timetable
  - name: Meals
  - name: History
paths:
  /api/v1/admin/access-logs:
    parameters:
      - { name: client_ip, in: query, schema: { type: string, maxLength: 255 } }
      - { name: school_id, in: query, schema: { type: string, maxLength: 255 } }
      - { name: grade, in: query, schema: { type: string }, description: Decimal grade from 1 to 6. }
      - { name: class, in: query, schema: { type: string }, description: Decimal class from 1 to 99. }
      - { name: start_day, in: query, schema: { type: string, format: date } }
      - { name: end_day, in: query, schema: { type: string, format: date } }
      - { name: route, in: query, schema: { type: string, maxLength: 255 } }
      - { name: status, in: query, schema: { type: string }, description: Decimal HTTP status from 100 to 599. }
      - { name: origin_class, in: query, schema: { type: string, enum: [frontend, external, unknown, ''] } }
      - { name: cache_status, in: query, schema: { type: string, maxLength: 255 } }
      - { name: cursor, in: query, schema: { type: string }, description: Positive decimal page cursor from a previous JSON response. }
      - { name: limit, in: query, schema: { type: string }, description: JSON page size from 1 to 100, default 50. }
      - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json }, description: CSV exports at most 5000 matching records and ignores page cursor and limit for export size. }
    get:
      tags: [System]
      summary: Query retained access logs
      description: Administrator-only data. Availability and retention depend on deployment configuration. Repeated or unknown query parameters are rejected.
      security: [{ AnalyticsAdmin: [] }]
      responses:
        '200':
          description: Paginated JSON or a UTF-8 CSV attachment with a byte-order mark.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Content-Disposition: { schema: { type: string }, description: Present for CSV exports. }
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, limit, has_more, dropped]
                properties:
                  items: { type: array, items: { type: object } }
                  next_cursor: { type: [string, 'null'] }
                  limit: { type: integer, minimum: 1, maximum: 100 }
                  has_more: { type: boolean }
                  dropped: { type: integer, minimum: 0 }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/SuggestionAdminBadRequest' }
        '401': { $ref: '#/components/responses/SuggestionAdminUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Access log store or gateway unavailable, or service overloaded.
          headers:
            Retry-After: { description: Present when the service is overloaded., schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    head:
      tags: [System]
      summary: Check access to retained access logs
      security: [{ AnalyticsAdmin: [] }]
      responses:
        '200': { description: Query successful; no response body. }
        '400': { description: Invalid query. }
        '401': { description: Invalid administrator token. }
        '429': { description: Rate limit reached. }
        '503': { description: Access log store or gateway unavailable. }
  /api/v1/suggestions:
    get:
      tags: [System]
      summary: Search approved feature suggestions
      description: Only approved suggestions are returned. Availability depends on the deployment's suggestion store.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Optional keyword; blank searches all approved suggestions. }
        - { name: cursor, in: query, schema: { type: string, pattern: '^[0-9]{1,19}$' }, description: Positive signed 64-bit cursor returned by a previous page. }
        - { name: limit, in: query, schema: { type: string }, description: Decimal page size from 1 to 100; defaults to 20. }
      responses:
        '200':
          description: Approved suggestions and the cursor for the next page, if any.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, nextCursor]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [id, title, description, context, createdAt]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string }
                        context: { type: [string, 'null'] }
                        createdAt: { type: string, format: date-time }
                  nextCursor: { type: [string, 'null'] }
        '400':
          description: Invalid query.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Suggestion store disabled or unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [System]
      summary: Submit a feature suggestion
      description: No login is required. The author token is returned once; retain it to check the submission. The JSON body must not exceed 4096 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              additionalProperties: false
              properties:
                title: { type: string, description: Nonblank; at most 100 characters after trimming. }
                description: { type: string, description: Nonblank; at most 2000 characters after trimming. }
                context: { type: [string, 'null'], description: Optional; at most 500 characters after trimming. }
      responses:
        '201':
          description: Accepted for review; the author token is returned only once.
          content:
            application/json:
              schema:
                type: object
                required: [id, token]
                properties:
                  id: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' }
                  token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        '400':
          description: Invalid submission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A similar suggestion was submitted recently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Suggestion store disabled, full, or unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/suggestions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: Read your submitted feature suggestion
      description: Use the author token returned at submission. A nonexistent identifier and an invalid token both return 401.
      security: [{ SuggestionAuthor: [] }]
      responses:
        '200':
          description: Author-visible suggestion; sensitive token hashes and reviewer notes are omitted.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorSuggestion' }
        '401':
          description: Missing or invalid author token, or unknown identifier.
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Suggestion store or gateway unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    head:
      tags: [System]
      summary: Check access to your submitted feature suggestion
      description: Returns the corresponding GET status and headers without a response body.
      security: [{ SuggestionAuthor: [] }]
      responses:
        '200': { description: Suggestion accessible. }
        '401': { description: Missing or invalid author token, or unknown identifier. }
        '429': { description: Rate limit reached. }
        '503': { description: Suggestion store or gateway unavailable. }
  /api/v1/admin/suggestions:
    parameters:
      - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, merged] } }
      - { name: cursor, in: query, schema: { type: string, pattern: '^[0-9]{1,19}$' }, description: Positive ASCII decimal cursor within signed 64-bit range. }
      - { name: limit, in: query, schema: { type: string }, description: Decimal page size from 1 to 100; defaults to 50. }
    get:
      tags: [System]
      summary: List feature suggestions for review
      security: [{ AnalyticsAdmin: [] }]
      responses:
        '200':
          description: Suggestions and next-page cursor.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, nextCursor]
                properties:
                  suggestions: { type: array, items: { $ref: '#/components/schemas/AdminSuggestion' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/SuggestionAdminBadRequest' }
        '401': { $ref: '#/components/responses/SuggestionAdminUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/SuggestionAdminUnavailable' }
    head:
      tags: [System]
      summary: Check access to the suggestion review list
      security: [{ AnalyticsAdmin: [] }]
      responses:
        '200': { description: List accessible; no response body, headers: { Cache-Control: { schema: { type: string, const: no-store } } } }
        '400': { description: Invalid query. }
        '401': { description: Invalid administrator token, headers: { WWW-Authenticate: { schema: { type: string } } } }
        '429': { description: Rate limit reached. }
        '503': { description: Store or gateway unavailable. }
  /api/v1/admin/suggestions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    patch:
      tags: [System]
      summary: Review a feature suggestion
      description: Allowed transitions are pending to approved, rejected or merged; approved to rejected; rejected to approved; and merged to pending. Merge requires an eligible distinct target.
      security: [{ AnalyticsAdmin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [pending, approved, rejected, merged] }
                merged_into: { type: [string, 'null'], description: Target identifier when merging. }
                reviewer_note: { type: [string, 'null'], description: Optional review note, at most 500 characters after trimming. }
      responses:
        '200':
          description: Updated suggestion.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSuggestion' }
        '400': { $ref: '#/components/responses/SuggestionAdminBadRequest' }
        '401': { $ref: '#/components/responses/SuggestionAdminUnauthorized' }
        '404': { $ref: '#/components/responses/SuggestionAdminNotFound' }
        '413': { $ref: '#/components/responses/SuggestionAdminTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/SuggestionAdminUnavailable' }
    delete:
      tags: [System]
      summary: Delete a feature suggestion
      security: [{ AnalyticsAdmin: [] }]
      responses:
        '200':
          description: Deleted.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { type: object, required: [deleted], properties: { deleted: { const: true } } }
        '400': { $ref: '#/components/responses/SuggestionAdminBadRequest' }
        '401': { $ref: '#/components/responses/SuggestionAdminUnauthorized' }
        '404': { $ref: '#/components/responses/SuggestionAdminNotFound' }
        '413': { $ref: '#/components/responses/SuggestionAdminTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/SuggestionAdminUnavailable' }
  /api/v1/webhooks:
    post:
      tags: [System]
      summary: Create an experimental webhook subscription
      description: Disabled by default. The management token is returned once; retain it securely. Do not enable in public production before abuse and storage controls are complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school, grade, class, destination]
              additionalProperties: false
              properties:
                school: { type: string, pattern: '^[0-9]+:[^:\x00-\x1f\x7f]{1,50}$' }
                grade: { type: integer, minimum: 1, maximum: 6 }
                class: { type: integer, minimum: 1, maximum: 99 }
                destination: { type: string, format: uri, maxLength: 2048, description: Only supported Discord or Google Chat HTTPS webhook URLs. }
      responses:
        '200':
          description: Created; token is only returned once.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, provider]
                properties:
                  id: { type: string }
                  token: { type: string }
                  provider: { type: string, enum: [discord, google-chat] }
        '400': { description: Invalid request. }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Feature disabled, subscription limit reached, or storage unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                disabled:
                  value: { error: Webhook 기능이 활성화되지 않았습니다, code: webhooks_disabled }
                limit:
                  value: { error: 구독 한도에 도달했습니다, code: subscription_limit }
                unavailable:
                  value: { error: Webhook 저장소를 사용할 수 없습니다, code: webhooks_unavailable }
  /api/v1/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: Read an experimental webhook subscription
      security: [{ WebhookManagement: [] }]
      description: Supply this subscription's management token as a Bearer token, not the analytics administrator token.
      responses:
        '200': { description: Subscription scope and provider without destination or token. }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
    put:
      tags: [System]
      summary: Replace subscription filters or its destination
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [filters]
                - required: [destination]
              additionalProperties: false
              properties:
                destination: { type: string, format: uri, maxLength: 2048, description: New allowed URL for the existing provider. }
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    subject: { type: string, minLength: 1, maxLength: 50 }
                    teacher: { type: string, minLength: 1, maxLength: 50 }
                    weekday: { type: integer, minimum: 1, maximum: 5 }
                    period: { type: integer, minimum: 1, maximum: 20 }
                    type: { type: string, enum: [added, deleted, changed] }
                    quietHours:
                      type: object
                      description: KST quiet interval; equal start/end is invalid. Tests bypass quiet hours.
                      required: [start, end]
                      additionalProperties: false
                      properties:
                        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      responses:
        '200': { description: Filters or destination replaced. }
        '400': { description: Invalid filters or destination, or different destination provider. }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
    delete:
      tags: [System]
      summary: Delete an experimental webhook subscription
      security: [{ WebhookManagement: [] }]
      description: Supply this subscription's management token as a Bearer token; in-flight requests cannot be recalled.
      responses:
        '200': { description: Subscription and queued deliveries deleted. }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
  /api/v1/webhooks/{id}/rotate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    post:
      tags: [System]
      summary: Replace a webhook subscription management token
      description: Generate and safely retain a random 32-byte Base64url token before sending it. If the response is lost, try the saved new and previous tokens to determine which is valid. The old token is revoked when the transaction succeeds.
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newToken]
              additionalProperties: false
              properties:
                newToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200': { description: Token replaced; existing subscription and queued deliveries are preserved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
  /api/v1/webhooks/{id}/schedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: Get the subscription notification schedule
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: The active schedule, or null when using immediate notifications.
          content:
            application/json:
              schema: &scheduleResponse
                type: object
                required: [schedule]
                additionalProperties: false
                properties:
                  schedule:
                    oneOf:
                      - { type: 'null' }
                      - &scheduleInput
                        type: object
                        required: [mode, time, subject]
                        additionalProperties: false
                        properties:
                          mode: { type: string, enum: [immediate, daily_summary, subject_prep] }
                          time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                          subject: { type: [string, 'null'], maxLength: 50 }
                        allOf:
                          - if: { properties: { mode: { const: subject_prep } } }
                            then: { properties: { subject: { type: string, minLength: 1, pattern: '\S' } } }
                            else: { properties: { subject: { type: 'null' } } }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
    put:
      tags: [System]
      summary: Replace the subscription notification schedule
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: *scheduleInput
      responses:
        '200':
          description: The saved schedule.
          content:
            application/json:
              schema: *scheduleResponse
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
    delete:
      tags: [System]
      summary: Cancel the schedule and return to immediate notifications
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: Whether an active schedule was canceled.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                additionalProperties: false
                properties: { deleted: { type: boolean } }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
  /api/v1/webhooks/{id}/template:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: Get a subscription message template
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: Template, format and provider; a null template uses the default.
          content:
            application/json:
              schema: &webhookTemplateResult
                type: object
                required: [template, discordEmbed, provider]
                additionalProperties: false
                properties:
                  template: { type: [string, 'null'], maxLength: 1200 }
                  discordEmbed: { type: boolean }
                  provider: { type: string, enum: [discord, google-chat] }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
    put:
      tags: [System]
      summary: Save a subscription message template
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: &webhookTemplateInput
              type: object
              required: [template, discordEmbed]
              additionalProperties: false
              properties:
                template: { type: string, minLength: 1, maxLength: 1200 }
                discordEmbed: { type: boolean }
      responses:
        '200':
          description: Saved template and provider.
          content:
            application/json:
              schema: *webhookTemplateResult
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
    delete:
      tags: [System]
      summary: Restore the default subscription template
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: Template reset.
          content:
            application/json:
              schema:
                type: object
                required: [reset]
                additionalProperties: false
                properties: { reset: { const: true } }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
  /api/v1/webhooks/{id}/template/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    post:
      tags: [System]
      summary: Preview a template without creating a delivery
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: *webhookTemplateInput
      responses:
        '200':
          description: Sample provider payload; nothing is sent or queued.
          content:
            application/json:
              schema:
                type: object
                required: [payload]
                additionalProperties: false
                properties:
                  payload:
                    oneOf:
                      - type: object
                        required: [content, allowed_mentions]
                        additionalProperties: false
                        properties:
                          content: { type: string, maxLength: 1800 }
                          allowed_mentions: &webhookNoMentions
                            type: object
                            required: [parse]
                            additionalProperties: false
                            properties: { parse: { type: array, maxItems: 0 } }
                      - type: object
                        required: [embeds, allowed_mentions]
                        additionalProperties: false
                        properties:
                          embeds:
                            type: array
                            minItems: 1
                            maxItems: 1
                            items:
                              type: object
                              required: [description]
                              additionalProperties: false
                              properties: { description: { type: string, maxLength: 1800 } }
                          allowed_mentions: *webhookNoMentions
                      - type: object
                        required: [text]
                        additionalProperties: false
                        properties: { text: { type: string, maxLength: 1800 } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
  /api/v1/webhooks/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    post:
      tags: [System]
      summary: Enqueue a test notification
      security: [{ WebhookManagement: [] }]
      description: Queues a test, not a delivery confirmation; at most one request per subscription per minute.
      responses:
        '200':
          description: Test enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [eventId]
                properties: { eventId: { type: string } }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '413':
          description: Request body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: List recent delivery states for a webhook subscription
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: At most 50 delivery states; no destination or message body.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      required: [event_id, state, attempts, next_at, last_status]
                      properties:
                        event_id: { type: string }
                        state: { type: string, enum: [pending, leased, delivered, failed, canceled] }
                        attempts: { type: integer, minimum: 0 }
                        next_at: { type: number, description: Unix timestamp in seconds. }
                        last_status: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/WebhookUnauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/WebhookUnavailable' }
  /api/v1/analytics/pageview:
    post:
      tags: [System]
      summary: Record a pseudonymous first-party page view
      description: Optional analytics. Maximum body size 4096 bytes. Separate 60/minute client limit. Does not record school, class, raw identifiers, IP or User-Agent in the analytics database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitorId, sessionId, page]
              properties:
                visitorId: { type: string, format: uuid, description: Canonical lowercase UUID version 4. }
                sessionId: { type: string, format: uuid, description: Canonical lowercase UUID version 4. }
                page: { type: string, enum: ['/', '/timetable', '/meals'] }
      responses:
        '202':
          description: Page view stored.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Body exceeds 4096 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Analytics disabled or storage temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/admin/history-stats:
    get:
      tags: [System]
      summary: Read private observed timetable history statistics
      description: Pi backend route only; the public Cloudflare gateway does not forward it. Disabled unless OPENCIGAN_HISTORY_STATS_ENABLED is 1. Statistics cover retained observations, not all historical changes; matching teacher names do not establish teacher identity.
      security: [{ AnalyticsAdmin: [] }]
      parameters:
        - name: school
          in: query
          required: true
          description: School identifier in code:name form.
          schema: { type: string, maxLength: 100 }
        - name: week
          in: query
          required: true
          description: Monday of the requested week in ISO date format.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Observed statistics; null values mean the week has not been observed in the retention window.
          content:
            application/json:
              schema:
                type: object
                required: [observed, totalChanges, byType, affectedClasses, lastObservedAt, retainedSince, comparisonCoverage, subjectPeriods, teacherOverlaps, changesByObservedDay, sourceUpdateObservations]
                properties:
                  observed: { type: boolean }
                  totalChanges: { type: [integer, 'null'], minimum: 0 }
                  byType:
                    type: [object, 'null']
                    required: [added, changed, deleted]
                    properties:
                      added: { type: integer, minimum: 0 }
                      changed: { type: integer, minimum: 0 }
                      deleted: { type: integer, minimum: 0 }
                  affectedClasses: { type: [integer, 'null'], minimum: 0 }
                  lastObservedAt: { type: [string, 'null'], format: date-time }
                  retainedSince: { type: string, format: date-time }
                  comparisonCoverage: { const: unknown }
                  changesByObservedDay:
                    type: [array, 'null']
                    items:
                      type: object
                      required: [date, count]
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer, minimum: 0 }
                  subjectPeriods:
                    type: [array, 'null']
                    items:
                      type: object
                      required: [subject, classPeriods]
                      properties:
                        subject: { type: string }
                        classPeriods: { type: integer, minimum: 0 }
                  teacherOverlaps:
                    type: [array, 'null']
                    items:
                      type: object
                      required: [date, period, teacher, classes]
                      properties:
                        date: { type: string, format: date }
                        period: { type: integer }
                        teacher: { type: string }
                        classes:
                          type: array
                          items:
                            type: object
                            required: [grade, class]
                            properties:
                              grade: { type: integer }
                              class: { type: integer }
                  sourceUpdateObservations:
                    type: [object, 'null']
                    required: [distinctTimestamps, intervalCount, meanIntervalSeconds, firstSourceAt, lastSourceAt]
                    properties:
                      distinctTimestamps: { type: integer, minimum: 1 }
                      intervalCount: { type: integer, minimum: 0 }
                      meanIntervalSeconds: { type: [number, 'null'], minimum: 0 }
                      firstSourceAt: { type: string, format: date-time }
                      lastSourceAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing or invalid administrator token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: History statistics disabled or storage unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/admin/analytics:
    get:
      tags: [System]
      summary: Read private usage statistics
      description: Browser-based visitor estimates; not an exact person count. API telemetry is asynchronous and may lose events during overload or shutdown. Excludes health checks and preflight requests. Responses use Cache-Control no-store.
      security: [{ AnalyticsAdmin: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Aggregate statistics in Asia/Seoul dates.
          content:
            application/json:
              schema:
                type: object
                required: [periodDays, visitors, sessions, pageViews, apiRequests, apiErrors, apiErrorRate, apiAverageMs, droppedApiEvents, daily, routes]
                properties:
                  periodDays: { type: integer, minimum: 1, maximum: 90 }
                  visitors: { type: integer, minimum: 0 }
                  sessions: { type: integer, minimum: 0 }
                  pageViews: { type: integer, minimum: 0 }
                  apiRequests: { type: integer, minimum: 0 }
                  apiErrors: { type: integer, minimum: 0 }
                  apiErrorRate: { type: number, minimum: 0, maximum: 1 }
                  apiAverageMs: { type: number, minimum: 0 }
                  droppedApiEvents: { type: integer, minimum: 0, description: Process-local count since startup. }
                  refreshObservations:
                    type: object
                    description: Most recent actual cache refresh attempt per resource in this process since restart. Cache hits and backoff responses are not attempts. A single observation does not establish provider-wide readiness.
                    additionalProperties:
                      type: object
                      required: [result, observedAt]
                      properties:
                        result: { type: string, enum: [success, failure, not_cached], description: not_cached means the response exceeded the cache size limit. }
                        observedAt: { type: string, format: date-time }
                        lastSuccessAt: { type: string, format: date-time }
                        lastFailureAt: { type: string, format: date-time }
                        lastFailureKind: { type: string, enum: [timeout, http, network, provider_response, other], description: Coarse exception category of the most recent failed refresh, retained after later success; provider_response includes RuntimeError and does not prove an upstream fault. }
                        durationMs: { type: integer, minimum: 0, description: Elapsed time of the latest completed refresh attempt in milliseconds; absent on older servers. }
                        origin: { type: [string, 'null'], enum: [timetable, calendar, null], description: Route that initiated the latest refresh when known; shared cache hits do not update it. }
                  cacheWaitObservations:
                    type: object
                    description: Latest completed same-key cache refresh lock wait per resource in this process; separate from refresh attempts and absent on older servers.
                    additionalProperties:
                      type: object
                      required: [waitMs, observedAt]
                      properties:
                        waitMs: { type: integer, minimum: 0 }
                        observedAt: { type: string, format: date-time }
                  cacheStatuses:
                    type: object
                    description: Counts of recorded timetable cache outcomes; older events may have no outcome.
                    additionalProperties: { type: integer, minimum: 0 }
                  failureKinds:
                    type: object
                    description: Counts of recorded upstream_unavailable and service_overloaded errors.
                    additionalProperties: { type: integer, minimum: 0 }
                  apiHourly:
                    type: array
                    description: Nonempty Asia/Seoul hourly buckets from the last 24 hours, independent of days. First and last buckets may be partial. upstream_errors counts the generic upstream_unavailable response and does not establish provider failure. Async recording can lose events.
                    items:
                      type: object
                      required: [hour, requests, errors, upstream_errors, overload_errors, cache_hits, stale_responses]
                      properties:
                        hour: { type: string, format: date-time }
                        requests: { type: integer, minimum: 0 }
                        errors: { type: integer, minimum: 0 }
                        upstream_errors: { type: integer, minimum: 0 }
                        overload_errors: { type: integer, minimum: 0 }
                        cache_hits: { type: integer, minimum: 0 }
                        stale_responses: { type: integer, minimum: 0 }
                  daily:
                    type: array
                    items:
                      type: object
                      required: [day, visitors, sessions, page_views, api_requests]
                      properties:
                        day: { type: string, format: date }
                        visitors: { type: integer, minimum: 0 }
                        sessions: { type: integer, minimum: 0 }
                        page_views: { type: integer, minimum: 0 }
                        api_requests: { type: integer, minimum: 0 }
                  routes:
                    type: array
                    items:
                      type: object
                      required: [route, requests, errors, avg_ms]
                      properties:
                        route: { type: string }
                        requests: { type: integer, minimum: 0 }
                        errors: { type: integer, minimum: 0 }
                        avg_ms: { type: number, minimum: 0 }
                        data_failures: { type: integer, minimum: 0, description: Generic upstream_unavailable responses; not proof of provider failure. }
                        overload_errors: { type: integer, minimum: 0, description: service_overloaded responses. }
                        unclassified_server_errors: { type: integer, minimum: 0, description: HTTP 5xx records without a recorded failure category, including older data. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing or incorrect bearer token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Analytics disabled or storage temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/admin/access-anomalies:
    parameters:
      - name: window_hours
        in: query
        description: Look-back window, bounded by the configured access-log retention period.
        schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
      - name: max_requests_per_ip
        in: query
        description: Flag request volume strictly greater than this threshold.
        schema: { type: integer, minimum: 1, maximum: 100000, default: 1000 }
      - name: max_error_ratio
        in: query
        description: Flag an error ratio strictly greater than this threshold.
        schema: { type: number, exclusiveMinimum: 0, maximum: 1, default: 0.5 }
      - name: max_distinct_schools
        in: query
        description: Flag a distinct-school count strictly greater than this threshold.
        schema: { type: integer, minimum: 1, maximum: 100000, default: 50 }
      - name: min_requests
        in: query
        description: Minimum request count required for a client IP to be considered for any finding, including status_errors.
        schema: { type: integer, minimum: 0, maximum: 1000000, default: 20 }
      - name: max_status_errors
        in: query
        description: Optional threshold. When supplied, separately flag 404, 429, or 5xx counts strictly greater than this value.
        schema: { type: integer, minimum: 1, maximum: 100000 }
    get:
      tags: [System]
      summary: Review retained access logs for configured traffic patterns
      description: >-
        Read-only review of retained access-log data. This endpoint does not block
        requests or send alerts. The Cloudflare gateway exposes this route only
        when ACCESS_ANOMALIES_ENABLED is "1" and requires its general and admin
        rate limiters. The backend separately requires the shared
        OPENCIGAN_ADMIN_TOKEN bearer token. Without the gateway flag the edge
        returns 404. Supports GET and HEAD.
      security: [{ AnalyticsAdmin: [] }]
      responses:
        '200':
          description: Findings computed from retained rows within the requested window and retention period.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessAnomalyReview' }
              example:
                findings:
                  - client_ip: 192.0.2.10
                    kind: status_errors
                    status_group: '429'
                    observed: 3
                    threshold: 2
                    requests: 20
                    first_seen: '2026-11-26T09:00:00+09:00'
                    last_seen: '2026-11-26T09:15:00+09:00'
                    detail: Status error count exceeded the review threshold.
                window_hours: 24
                thresholds:
                  max_requests_per_ip: 1000
                  max_error_ratio: 0.5
                  max_distinct_schools: 50
                  min_requests: 20
                  max_status_errors: 2
        '400':
          description: Unsupported, repeated, malformed, or out-of-range query parameter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 숫자 형식이나 범위가 올바르지 않습니다, code: invalid_request }
        '401':
          description: OPENCIGAN_ADMIN_TOKEN is missing or does not match.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 인증이 필요합니다, code: unauthorized }
        '404':
          description: The Cloudflare gateway route is not exposed when ACCESS_ANOMALIES_ENABLED is not "1".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: API 연결을 처리하지 못했어요., code: not_found, message: API 연결을 처리하지 못했어요. }
        '405':
          description: When the route is enabled at the gateway, a method other than GET or HEAD is not supported. The backend and enabled Cloudflare route return different error text. When ACCESS_ANOMALIES_ENABLED is not "1", the edge returns 404 for every method.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                backend:
                  value: { error: 지원하지 않는 메서드입니다, code: method_not_allowed }
                edge:
                  value: { error: API 연결을 처리하지 못했어요., code: method_not_allowed, message: API 연결을 처리하지 못했어요. }
        '429':
          description: Backend admin or Cloudflare general/admin request limit reached.
          headers:
            Retry-After:
              description: Edge throttling retry delay in seconds, when supplied.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                backend:
                  value: { error: 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요., code: rate_limited }
                edge:
                  value: { error: API 연결을 처리하지 못했어요., code: edge_rate_limited, message: API 연결을 처리하지 못했어요. }
        '503':
          description: Backend access-log storage is disabled or unavailable, a required gateway binding/rate limiter is missing, or the edge cannot reach the private API.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                storage_disabled:
                  value: { error: 접속 로그가 비활성화되어 있습니다, code: access_logs_disabled }
                storage_unavailable:
                  value: { error: 접속 로그를 불러오지 못했습니다, code: access_logs_unavailable }
                gateway_unconfigured:
                  value: { error: API 연결을 처리하지 못했어요., code: gateway_unconfigured, message: API 연결을 처리하지 못했어요. }
                gateway_unavailable:
                  value: { error: API 연결을 처리하지 못했어요., code: gateway_unavailable, message: API 연결을 처리하지 못했어요. }
    head:
      tags: [System]
      summary: Check the access-anomaly review response without a body
      description: Uses the same authentication, query validation, analysis, and rate limits as GET. The response body is empty for every status.
      security: [{ AnalyticsAdmin: [] }]
      responses:
        '200':
          description: Findings were computed successfully. The response body is empty for HEAD.
          headers:
            Cache-Control:
              description: Responses are not stored by caches.
              schema: { type: string, const: no-store }
        '400': { description: Unsupported, repeated, malformed, or out-of-range query parameter. No response body. }
        '401':
          description: OPENCIGAN_ADMIN_TOKEN is missing or does not match. No response body.
          headers:
            WWW-Authenticate:
              schema: { type: string }
        '404': { description: The Cloudflare gateway route is not exposed when ACCESS_ANOMALIES_ENABLED is not "1". No response body. }
        '429':
          description: Backend admin or Cloudflare general/admin request limit reached. No response body.
          headers:
            Retry-After:
              description: Retry delay in seconds, when supplied by the backend or edge.
              schema: { type: string }
        '503': { description: Backend access-log storage or gateway configuration is unavailable. No response body. }
  /api/v1/status:
    head:
      tags: [System]
      summary: Check process liveness without a response body
      responses:
        '200': { description: Process is responding; upstream providers are not checked. }
        '404': { description: Route not found. }
        '429':
          description: Request rate limit reached.
          headers:
            Retry-After: { description: Retry delay when supplied by the server., schema: { type: string } }
        '503': { description: Gateway unavailable or unconfigured. }
    get:
      tags: [System]
      summary: Check process liveness
      responses:
        '200':
          description: Process is responding; upstream providers are not checked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
              example: { status: ok, scope: process liveness }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: The public gateway is unconfigured or cannot reach the private API; this does not establish upstream provider health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: API connection unavailable, code: gateway_unavailable }
  /api/v1/schools:
    get:
      tags: [Schools]
      summary: Search Comcigan schools
      parameters:
        - name: q
          in: query
          required: true
          description: Must contain a non-whitespace character; leading and trailing whitespace is trimmed after the 50-character limit is checked.
          schema: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
          example: 봄빛고등학교
      responses:
        '200':
          description: Matching schools.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolSearchResponse' }
              example:
                schools: [{ id: '2:봄빛고등학교', name: 봄빛고등학교, region: 서울특별시 }]
                stale: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/neis/schools:
    get:
      tags: [Schools]
      summary: Search NEIS schools
      parameters:
        - name: q
          in: query
          required: true
          description: Must contain a non-whitespace character; leading and trailing whitespace is trimmed after the 50-character limit is checked.
          schema: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
          example: 봄빛고등학교
      responses:
        '200':
          description: Matching NEIS schools.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeisSchoolSearchResponse' }
              example:
                schools: [{ id: 'B10:1234567', name: 봄빛고등학교, region: 고등학교, address: 서울특별시 예시구 예시로 1 }]
                stale: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/timetable:
    get:
      tags: [Timetable]
      summary: Get a school's timetable for a week
      description: Optional filters apply to records after the shared school/week cache lookup; filters do not trigger extra upstream requests.
      parameters:
        - name: school
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' }
          example: '2:봄빛고등학교'
        - name: week
          in: query
          required: true
          description: Monday of the current or following week (Asia/Seoul).
          schema: { type: string, format: date }
          example: '2026-11-16'
        - name: grade
          in: query
          required: false
          description: Return records only for this grade.
          schema: { type: integer, minimum: 1, maximum: 6 }
        - name: class
          in: query
          required: false
          description: Return records only for this class number (can be combined with grade).
          schema: { type: integer, minimum: 1, maximum: 99 }
        - name: teacher
          in: query
          required: false
          description: Case-insensitive substring match on the teacher name, maximum 50 characters.
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '200':
          description: Timetable records for the requested week.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimetableResponse' }
              example:
                schoolId: '2:봄빛고등학교'
                weekStart: '2026-11-16'
                records: [{ grade: 1, class: 2, date: '2026-11-16', period: 1, subject: 수학, teacher: 교사A, isChanged: false }]
                sourceUpdatedAt: '2026-11-13T18:00:00+09:00'
                fetchedAt: '2026-11-14T01:00:00Z'
                stale: false
                cacheStatus: miss
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/timetable.ics:
    get:
      tags: [Timetable]
      summary: Subscribe to a rolling classroom timetable as iCalendar
      description: |-
        Returns the current week (and optionally the next week) in Asia/Seoul.
        Calendar subscribers may use the same URL across weeks. The feed uses
        the same school/week cache as the JSON timetable endpoint. Individual
        lessons default to all-day events. In timed mode, user-provided bell times
        are interpreted in Asia/Seoul and serialized as UTC instants. Missing
        periods remain explicitly labelled all-day events. Times in the URL are
        shared with the API and calendar service; no server-side profile is saved.
      parameters:
        - name: school
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' }
          example: '2:봄빛고등학교'
        - name: grade
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 6 }
        - name: class
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 99 }
        - name: teacher
          in: query
          required: false
          description: Optional case-insensitive substring filter.
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: weeks
          in: query
          required: false
          description: Number of rolling weeks to include. Default 1 to minimize upstream traffic.
          schema: { type: integer, enum: [1, 2], default: 1 }
        - name: mode
          in: query
          schema: { type: string, enum: [periods, summary, timed], default: periods }
          description: Per-lesson all-day, daily summary, or supplied bell-time events.
        - name: times
          in: query
          required: false
          description: 'Timed mode only. Comma-separated period:HHMM-HHMM entries, periods 1..20; unique periods and nonoverlapping ordered times. Example 1:0900-0950,2:1000-1050. Changing times requires replacing the subscription URL.'
          schema: { type: string, maxLength: 400 }
        - name: weekday_times
          in: query
          required: false
          description: 'Timed mode only. Comma-separated ISO weekday.period:HHMM-HHMM overrides, weekday 1=Monday through 7=Sunday. For example 2.1:1000-1050 overrides Tuesday period 1. Other periods use times. Each weekday must remain ordered and nonoverlapping after applying overrides.'
          schema: { type: string, maxLength: 2400 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: UTF-8 RFC 5545 iCalendar feed
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            text/calendar:
              schema: { type: string }
        '304':
          description: Calendar unchanged; no response body.
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/meals:
    get:
      tags: [Meals]
      summary: Get meals for a NEIS school
      parameters:
        - name: school
          in: query
          required: true
          description: After trimming whitespace, an uppercase office letter followed by two decimal digits, a colon, and seven decimal digits. The raw input is limited to 20 characters. ASCII digits are recommended.
          schema: { type: string, minLength: 1, maxLength: 20 }
          example: 'B10:1234567'
        - name: from
          in: query
          required: true
          description: After trimming whitespace, a valid ISO date accepted by Python date.fromisoformat. Raw input is limited to 10 characters. Prefer YYYY-MM-DD; compact calendar and ISO week dates are also accepted.
          schema: { type: string, minLength: 1, maxLength: 10 }
          example: '2026-11-16'
        - name: to
          in: query
          required: true
          description: Inclusive end date using the same format as from; range may cover at most seven days.
          schema: { type: string, minLength: 1, maxLength: 10 }
          example: '2026-11-22'
      responses:
        '200':
          description: Meals in the requested date range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealsResponse' }
              example:
                meals: [{ date: '2026-11-16', type: 중식, dishes: [현미밥, 미역국, 과일] }]
                stale: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/timetable/history.rss:
    get:
      tags: [History]
      summary: Subscribe to observed classroom changes as RSS
      description: Most recent 50 observed changes for one classroom. Defaults to the current KST week; the feed does not refresh the source timetable and may miss unobserved changes. History must be enabled.
      parameters:
        - { name: school, in: query, required: true, schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' } }
        - { name: grade, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 6 } }
        - { name: class, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 99 } }
        - { name: week, in: query, schema: { type: string, format: date }, description: Optional Monday; defaults to the current KST week. }
        - { name: subject, in: query, schema: { type: string, minLength: 1, maxLength: 50 }, description: Case-sensitive substring in either the before or after subject. }
        - { name: teacher, in: query, schema: { type: string, minLength: 1, maxLength: 50 }, description: Case-sensitive substring in either the before or after teacher. }
        - { name: weekday, in: query, schema: { type: integer, minimum: 1, maximum: 5 }, description: Monday is 1; Friday is 5. }
        - { name: period, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: type, in: query, schema: { type: string, enum: [added, deleted, changed] } }
        - { name: group, in: query, schema: { type: string, enum: [changes, daily], default: changes }, description: Group the selected latest 50 changes by lesson date. }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: RSS 2.0 feed in UTF-8.
          headers: { ETag: { schema: { type: string } } }
          content: { application/rss+xml: { schema: { type: string } } }
        '304':
          description: Feed unchanged; no response body.
          headers: { ETag: { schema: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: History storage is disabled or temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                disabled:
                  value: { error: 변경 이력 저장이 활성화되지 않았습니다, code: history_disabled }
                unavailable:
                  value: { error: 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요., code: upstream_unavailable }
  /api/v1/timetable/history:
    get:
      tags: [History]
      summary: List observed timetable changes
      description: |-
        Returns observed changes, not a complete historical timetable. Pass
        `nextCursor` back as `cursor` to fetch the next page. History is kept
        for 30 days, and the first observation establishes a baseline.
      parameters:
        - name: school
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' }
          example: '2:봄빛고등학교'
        - name: week
          in: query
          required: true
          description: Monday date for the timetable week.
          schema: { type: string, format: date }
          example: '2026-11-16'
        - name: cursor
          in: query
          required: false
          description: Positive decimal change ID without leading zero, less than 9223372036854775808; surrounding whitespace is trimmed.
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: '42'
      responses:
        '200':
          description: One page of observed changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryResponse' }
              example:
                changes:
                  - observedAt: '2026-11-14T01:00:00Z'
                    grade: 1
                    class: 2
                    date: '2026-11-16'
                    period: 3
                    type: changed
                    before: { subject: 과학, teacher: 교사A }
                    after: { subject: 수학, teacher: 교사A }
                nextCursor: '42'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: History storage is disabled or temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                disabled:
                  value: { error: 변경 이력 저장이 활성화되지 않았습니다, code: history_disabled }
                unavailable:
                  value: { error: 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요., code: upstream_unavailable }
components:
  securitySchemes:
    SuggestionAuthor:
      type: http
      scheme: bearer
      description: The author token returned once when the suggestion is submitted.
    WebhookManagement:
      type: http
      scheme: bearer
      description: One-time token returned when creating the individual webhook subscription.
    AnalyticsAdmin:
      type: http
      scheme: bearer
      description: Shared server-side OPENCIGAN_ADMIN_TOKEN. Never embed it in the frontend bundle.
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          description: Stable machine-readable error code; additional codes may be introduced without an API version change.
      additionalProperties: true
      example: { error: Invalid query parameter, code: invalid_request }
    AuthorSuggestion:
      type: object
      required: [id, title, description, context, status, created_at, reviewed_at, merged_into]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' }
        title: { type: string }
        description: { type: string }
        context: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected, merged] }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        merged_into: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{24}$' }
    AdminSuggestion:
      type: object
      required: [id, title, description, context, status, created_at, reviewed_at, merged_into, reviewer_note]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' }
        title: { type: string }
        description: { type: string }
        context: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected, merged] }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        merged_into: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{24}$' }
        reviewer_note: { type: [string, 'null'] }
    AccessAnomalyReview:
      type: object
      required: [findings, window_hours, thresholds]
      properties:
        findings:
          type: array
          items: { $ref: '#/components/schemas/AccessAnomalyFinding' }
        window_hours: { type: integer, minimum: 1, maximum: 720 }
        thresholds:
          type: object
          required: [max_requests_per_ip, max_error_ratio, max_distinct_schools, min_requests]
          properties:
            max_requests_per_ip: { type: integer, minimum: 1, maximum: 100000 }
            max_error_ratio: { type: number, exclusiveMinimum: 0, maximum: 1 }
            max_distinct_schools: { type: integer, minimum: 1, maximum: 100000 }
            min_requests: { type: integer, minimum: 0, maximum: 1000000 }
            max_status_errors: { type: integer, minimum: 1, maximum: 100000 }
          additionalProperties: false
      additionalProperties: false
    AccessAnomalyFinding:
      type: object
      description: >-
        Finding fields vary by kind. client_ip is present in retained access-log
        data and must be handled as sensitive administrator data. status_group
        is present only for status_errors. Other kind-specific counts and ratios
        are present only when applicable.
      required: [client_ip, kind, observed, threshold, first_seen, last_seen, detail]
      properties:
        client_ip: { type: string }
        kind: { type: string, enum: [status_errors, request_volume, error_ratio, school_scan] }
        status_group: { type: string, enum: ['404', '429', '5xx'] }
        observed: { type: number, minimum: 0 }
        threshold: { type: number, minimum: 0 }
        requests: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        error_ratio: { type: number, minimum: 0, maximum: 1 }
        distinct_schools: { type: integer, minimum: 0 }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        detail: { type: string }
      additionalProperties: false
    Status:
      type: object
      required: [status, scope]
      properties:
        status: { const: ok }
        scope: { const: process liveness }
      additionalProperties: false
    CacheStatus:
      type: string
      description: Cache result for this response.
      enum: [hit, miss, stale]
    School:
      type: object
      required: [id, name, region]
      properties:
        id: { type: string, description: Provider-specific school identifier. }
        name: { type: string }
        region: { type: string }
        address: { type: string }
      additionalProperties: false
    SchoolSearchResponse:
      type: object
      required: [schools, stale]
      properties:
        schools: { type: array, items: { $ref: '#/components/schemas/School' } }
        stale: { type: boolean }
      additionalProperties: false
    NeisSchoolSearchResponse:
      type: object
      required: [schools, stale]
      properties:
        schools:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/School' }
              - type: object
                required: [address]
                properties: { address: { type: string } }
        stale: { type: boolean }
      additionalProperties: false
    TimetableRecord:
      type: object
      required: [grade, class, date, period, subject, teacher, isChanged]
      properties:
        grade: { type: integer, minimum: 0 }
        class: { oneOf: [{ type: integer }, { type: string }] }
        date: { type: string, format: date }
        period: { type: integer, minimum: 1 }
        subject: { type: string }
        teacher: { type: [string, 'null'] }
        isChanged: { type: boolean }
      additionalProperties: false
    TimetableResponse:
      type: object
      required: [schoolId, weekStart, records, sourceUpdatedAt, fetchedAt, stale]
      properties:
        schoolId: { type: string }
        weekStart: { type: string, format: date }
        records: { type: array, items: { $ref: '#/components/schemas/TimetableRecord' } }
        sourceUpdatedAt: { type: [string, 'null'], format: date-time }
        sourceLessonStarts:
          type: object
          description: 원본에서 명시한 교시별 시작 시각. 종료 시각은 포함하지 않으며 자료가 없으면 생략합니다.
          propertyNames: { pattern: '^(?:[1-9]|[12][0-9]|30)$' }
          additionalProperties: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        fetchedAt: { type: string, format: date-time }
        stale: { type: boolean }
        cacheStatus: { $ref: '#/components/schemas/CacheStatus' }
      additionalProperties: false
    Meal:
      type: object
      required: [date, type, dishes]
      properties:
        date: { type: string, format: date }
        type: { type: string }
        dishes: { type: array, items: { type: string } }
        calories: { type: [string, 'null'], maxLength: 4000, description: 'Original NEIS calorie text; no estimated value.' }
        nutrition: { type: [string, 'null'], maxLength: 4000, description: 'Original NEIS NTR_INFO text, if provided.' }
        origin: { type: [string, 'null'], maxLength: 4000, description: 'Original NEIS ingredient origin text, if provided.' }
      additionalProperties: false
    MealsResponse:
      type: object
      required: [meals, stale]
      properties:
        meals: { type: array, items: { $ref: '#/components/schemas/Meal' } }
        stale: { type: boolean }
      additionalProperties: false
    HistoryChange:
      type: object
      required: [observedAt, grade, class, date, period, type, before, after]
      properties:
        observedAt: { type: string, format: date-time }
        grade: { type: integer, minimum: 0 }
        class: { oneOf: [{ type: integer }, { type: string }] }
        date: { type: string, format: date }
        period: { type: integer, minimum: 1 }
        type: { type: string, enum: [added, deleted, changed] }
        before:
          oneOf:
            - { $ref: '#/components/schemas/SubjectTeacher' }
            - { type: 'null' }
        after:
          oneOf:
            - { $ref: '#/components/schemas/SubjectTeacher' }
            - { type: 'null' }
      additionalProperties: false
    SubjectTeacher:
      type: object
      required: [subject, teacher]
      properties:
        subject: { type: string }
        teacher: { type: string }
      additionalProperties: false
    HistoryResponse:
      type: object
      required: [changes, nextCursor]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/HistoryChange' } }
        nextCursor: { type: [string, 'null'], description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
  responses:
    SuggestionAdminBadRequest:
      description: Invalid request or state transition.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SuggestionAdminUnauthorized:
      description: Missing or invalid administrator token.
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SuggestionAdminNotFound:
      description: Suggestion not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SuggestionAdminTooLarge:
      description: Request body exceeds 4096 bytes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SuggestionAdminUnavailable:
      description: Suggestion store or gateway unavailable.
      headers:
        Retry-After: { description: Present when the service is overloaded., schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WebhookUnauthorized:
      description: Invalid subscription or management token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 인증이 필요합니다, code: unauthorized }
    WebhookUnavailable:
      description: Webhooks or the scheduler are disabled, storage is unavailable, or the service is temporarily overloaded.
      headers:
        Retry-After:
          description: Retry delay when the service is temporarily overloaded.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid or missing query parameter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Invalid week, code: invalid_request }
    NotFound:
      description: No route matches this path.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Not found, code: not_found }
    TooManyRequests:
      description: Provider or deployment rate limit reached; retry later.
      headers:
        Retry-After:
          description: Original retry delay as delta-seconds or an HTTP-date, when supplied by the server.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Rate limit exceeded, code: rate_limited }
    UpstreamUnavailable:
      description: Required provider, credentials, or cache is unavailable.
      headers:
        Retry-After:
          description: Original retry delay as delta-seconds or an HTTP-date when the cache is in backoff; omitted for other failures.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Upstream unavailable, code: upstream_unavailable }
