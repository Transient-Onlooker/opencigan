openapi: 3.1.0
info:
  title: Opensigan API
  version: 1.0.0
  description: |-
    School timetable, school search, and meal data. All examples are synthetic.
    Responses from cached data include `stale`; the timetable endpoint also
    returns `cacheStatus` (`hit`, `miss`, or `stale`). The history endpoint returns
    observed timetable changes in cursor-paginated form.
servers:
  - url: /
    description: Same origin as the documentation page; relative requests only.
tags:
  - name: System
  - name: Schools
  - name: Timetable
  - name: Meals
  - name: History
paths:
  /api/v1/webhooks:
    post:
      tags: [System]
      summary: Create an experimental webhook subscription
      description: Disabled by default. The management token is returned once; retain it securely. Do not enable in public production before abuse and storage controls are complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school, grade, class, destination]
              additionalProperties: false
              properties:
                school: { type: string, pattern: '^[0-9]+:[^:\x00-\x1f\x7f]{1,50}$' }
                grade: { type: integer, minimum: 1, maximum: 6 }
                class: { type: integer, minimum: 1, maximum: 99 }
                destination: { type: string, format: uri, maxLength: 2048, description: Only supported Discord or Google Chat HTTPS webhook URLs. }
      responses:
        '200':
          description: Created; token is only returned once.
          content:
            application/json:
              schema:
                type: object
                required: [id, token, provider]
                properties:
                  id: { type: string }
                  token: { type: string }
                  provider: { type: string, enum: [discord, google-chat] }
        '400': { description: Invalid request. }
        '413': { description: Body exceeds 4096 bytes. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: Feature disabled, subscription limit reached, or storage unavailable. }
  /api/v1/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: Read an experimental webhook subscription
      security: [{ WebhookManagement: [] }]
      description: Supply this subscription's management token as a Bearer token, not the analytics administrator token.
      responses:
        '200': { description: Subscription scope and provider without destination or token. }
        '401': { description: Invalid subscription or token. }
        '503': { description: Feature disabled or storage unavailable. }
    put:
      tags: [System]
      summary: Replace a subscription's change filters
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filters]
              additionalProperties: false
              properties:
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    subject: { type: string, minLength: 1, maxLength: 50 }
                    teacher: { type: string, minLength: 1, maxLength: 50 }
                    weekday: { type: integer, minimum: 1, maximum: 5 }
                    period: { type: integer, minimum: 1, maximum: 20 }
                    type: { type: string, enum: [added, deleted, changed] }
                    quietHours:
                      type: object
                      description: KST quiet interval; equal start/end is invalid. Tests bypass quiet hours.
                      required: [start, end]
                      additionalProperties: false
                      properties:
                        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      responses:
        '200': { description: Filters replaced. }
        '400': { description: Invalid filters. }
        '401': { description: Invalid subscription or token. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: Feature disabled or storage unavailable. }
    delete:
      tags: [System]
      summary: Delete an experimental webhook subscription
      security: [{ WebhookManagement: [] }]
      description: Supply this subscription's management token as a Bearer token; in-flight requests cannot be recalled.
      responses:
        '200': { description: Subscription and queued deliveries deleted. }
        '401': { description: Invalid subscription or token. }
        '503': { description: Feature disabled or storage unavailable. }
  /api/v1/webhooks/{id}/rotate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    post:
      tags: [System]
      summary: Replace a webhook subscription management token
      description: Generate and safely retain a random 32-byte Base64url token before sending it. If the response is lost, try the saved new and previous tokens to determine which is valid. The old token is revoked when the transaction succeeds.
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newToken]
              additionalProperties: false
              properties:
                newToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200': { description: Token replaced; existing subscription and queued deliveries are preserved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid subscription or token. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: Feature disabled or storage unavailable. }
  /api/v1/webhooks/{id}/schedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: Get the subscription notification schedule
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: The active schedule, or null when using immediate notifications.
          content:
            application/json:
              schema: &scheduleResponse
                type: object
                required: [schedule]
                additionalProperties: false
                properties:
                  schedule:
                    oneOf:
                      - { type: 'null' }
                      - &scheduleInput
                        type: object
                        required: [mode, time, subject]
                        additionalProperties: false
                        properties:
                          mode: { type: string, enum: [immediate, daily_summary, subject_prep] }
                          time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
                          subject: { type: [string, 'null'], maxLength: 50 }
                        allOf:
                          - if: { properties: { mode: { const: subject_prep } } }
                            then: { properties: { subject: { type: string, minLength: 1, pattern: '\S' } } }
                            else: { properties: { subject: { type: 'null' } } }
        '401': { description: Invalid subscription or token. }
        '503': { description: Scheduler disabled or storage unavailable. }
    put:
      tags: [System]
      summary: Replace the subscription notification schedule
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: *scheduleInput
      responses:
        '200':
          description: The saved schedule.
          content:
            application/json:
              schema: *scheduleResponse
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid subscription or token. }
        '503': { description: Scheduler disabled or storage unavailable. }
    delete:
      tags: [System]
      summary: Cancel the schedule and return to immediate notifications
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: Whether an active schedule was canceled.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                additionalProperties: false
                properties: { deleted: { type: boolean } }
        '401': { description: Invalid subscription or token. }
        '503': { description: Scheduler disabled or storage unavailable. }
  /api/v1/webhooks/{id}/template:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: Get a subscription message template
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: Template, format and provider; a null template uses the default.
          content:
            application/json:
              schema: &webhookTemplateResult
                type: object
                required: [template, discordEmbed, provider]
                additionalProperties: false
                properties:
                  template: { type: [string, 'null'], maxLength: 1200 }
                  discordEmbed: { type: boolean }
                  provider: { type: string, enum: [discord, google-chat] }
        '401': { description: Invalid subscription or token. }
        '503': { description: Feature disabled or storage unavailable. }
    put:
      tags: [System]
      summary: Save a subscription message template
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: &webhookTemplateInput
              type: object
              required: [template, discordEmbed]
              additionalProperties: false
              properties:
                template: { type: string, minLength: 1, maxLength: 1200 }
                discordEmbed: { type: boolean }
      responses:
        '200':
          description: Saved template and provider.
          content:
            application/json:
              schema: *webhookTemplateResult
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid subscription or token. }
        '503': { description: Feature disabled or storage unavailable. }
    delete:
      tags: [System]
      summary: Restore the default subscription template
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: Template reset.
          content:
            application/json:
              schema:
                type: object
                required: [reset]
                additionalProperties: false
                properties: { reset: { const: true } }
        '401': { description: Invalid subscription or token. }
        '503': { description: Feature disabled or storage unavailable. }
  /api/v1/webhooks/{id}/template/preview:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    post:
      tags: [System]
      summary: Preview a template without creating a delivery
      security: [{ WebhookManagement: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: *webhookTemplateInput
      responses:
        '200':
          description: Sample provider payload; nothing is sent or queued.
          content:
            application/json:
              schema:
                type: object
                required: [payload]
                additionalProperties: false
                properties:
                  payload:
                    oneOf:
                      - type: object
                        required: [content, allowed_mentions]
                        additionalProperties: false
                        properties:
                          content: { type: string, maxLength: 1800 }
                          allowed_mentions: &webhookNoMentions
                            type: object
                            required: [parse]
                            additionalProperties: false
                            properties: { parse: { type: array, maxItems: 0 } }
                      - type: object
                        required: [embeds, allowed_mentions]
                        additionalProperties: false
                        properties:
                          embeds:
                            type: array
                            minItems: 1
                            maxItems: 1
                            items:
                              type: object
                              required: [description]
                              additionalProperties: false
                              properties: { description: { type: string, maxLength: 1800 } }
                          allowed_mentions: *webhookNoMentions
                      - type: object
                        required: [text]
                        additionalProperties: false
                        properties: { text: { type: string, maxLength: 1800 } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid subscription or token. }
        '503': { description: Feature disabled or storage unavailable. }
  /api/v1/webhooks/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    post:
      tags: [System]
      summary: Enqueue a test notification
      security: [{ WebhookManagement: [] }]
      description: Queues a test, not a delivery confirmation; at most one request per subscription per minute.
      responses:
        '200':
          description: Test enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [eventId]
                properties: { eventId: { type: string } }
        '401': { description: Invalid subscription or token. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: Feature disabled or storage unavailable. }
  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{24}$' } }
    get:
      tags: [System]
      summary: List recent delivery states for a webhook subscription
      security: [{ WebhookManagement: [] }]
      responses:
        '200':
          description: At most 50 delivery states; no destination or message body.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      required: [event_id, state, attempts, next_at, last_status]
                      properties:
                        event_id: { type: string }
                        state: { type: string, enum: [pending, leased, delivered, failed] }
                        attempts: { type: integer, minimum: 0 }
                        next_at: { type: number, description: Unix timestamp in seconds. }
                        last_status: { type: [integer, 'null'] }
        '401': { description: Invalid subscription or token. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: Feature disabled or storage unavailable. }
  /api/v1/analytics/pageview:
    post:
      tags: [System]
      summary: Record a pseudonymous first-party page view
      description: Optional analytics. Maximum body size 4096 bytes. Separate 60/minute client limit. Does not record school, class, raw identifiers, IP or User-Agent in the analytics database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitorId, sessionId, page]
              properties:
                visitorId: { type: string, format: uuid, description: Canonical lowercase UUID version 4. }
                sessionId: { type: string, format: uuid, description: Canonical lowercase UUID version 4. }
                page: { type: string, enum: ['/', '/timetable', '/meals'] }
      responses:
        '202':
          description: Page view stored.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: Body exceeds 4096 bytes. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: Analytics disabled or storage temporarily unavailable. }
  /api/v1/admin/analytics:
    get:
      tags: [System]
      summary: Read private usage statistics
      description: Browser-based visitor estimates; not an exact person count. API telemetry is asynchronous and may lose events during overload or shutdown. Excludes health checks and preflight requests. Responses use Cache-Control no-store.
      security: [{ AnalyticsAdmin: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Aggregate statistics in Asia/Seoul dates.
          content:
            application/json:
              schema:
                type: object
                required: [periodDays, visitors, sessions, pageViews, apiRequests, apiErrors, apiErrorRate, apiAverageMs, droppedApiEvents, daily, routes]
                properties:
                  periodDays: { type: integer, minimum: 1, maximum: 90 }
                  visitors: { type: integer, minimum: 0 }
                  sessions: { type: integer, minimum: 0 }
                  pageViews: { type: integer, minimum: 0 }
                  apiRequests: { type: integer, minimum: 0 }
                  apiErrors: { type: integer, minimum: 0 }
                  apiErrorRate: { type: number, minimum: 0, maximum: 1 }
                  apiAverageMs: { type: number, minimum: 0 }
                  droppedApiEvents: { type: integer, minimum: 0, description: Process-local count since startup. }
                  refreshObservations:
                    type: object
                    description: Most recent actual cache refresh attempt per resource in this process since restart. Cache hits and backoff responses are not attempts. A single observation does not establish provider-wide readiness.
                    additionalProperties:
                      type: object
                      required: [result, observedAt]
                      properties:
                        result: { type: string, enum: [success, failure, not_cached], description: not_cached means the response exceeded the cache size limit. }
                        observedAt: { type: string, format: date-time }
                        lastSuccessAt: { type: string, format: date-time }
                        lastFailureAt: { type: string, format: date-time }
                        durationMs: { type: integer, minimum: 0, description: Elapsed time of the latest completed refresh attempt in milliseconds; absent on older servers. }
                  cacheStatuses:
                    type: object
                    description: Counts of recorded timetable cache outcomes; older events may have no outcome.
                    additionalProperties: { type: integer, minimum: 0 }
                  failureKinds:
                    type: object
                    description: Counts of recorded upstream_unavailable and service_overloaded errors.
                    additionalProperties: { type: integer, minimum: 0 }
                  apiHourly:
                    type: array
                    description: Nonempty Asia/Seoul hourly buckets from the last 24 hours, independent of days. First and last buckets may be partial. upstream_errors counts the generic upstream_unavailable response and does not establish provider failure. Async recording can lose events.
                    items:
                      type: object
                      required: [hour, requests, errors, upstream_errors, overload_errors, cache_hits, stale_responses]
                      properties:
                        hour: { type: string, format: date-time }
                        requests: { type: integer, minimum: 0 }
                        errors: { type: integer, minimum: 0 }
                        upstream_errors: { type: integer, minimum: 0 }
                        overload_errors: { type: integer, minimum: 0 }
                        cache_hits: { type: integer, minimum: 0 }
                        stale_responses: { type: integer, minimum: 0 }
                  daily:
                    type: array
                    items:
                      type: object
                      required: [day, visitors, sessions, page_views, api_requests]
                      properties:
                        day: { type: string, format: date }
                        visitors: { type: integer, minimum: 0 }
                        sessions: { type: integer, minimum: 0 }
                        page_views: { type: integer, minimum: 0 }
                        api_requests: { type: integer, minimum: 0 }
                  routes:
                    type: array
                    items:
                      type: object
                      required: [route, requests, errors, avg_ms]
                      properties:
                        route: { type: string }
                        requests: { type: integer, minimum: 0 }
                        errors: { type: integer, minimum: 0 }
                        avg_ms: { type: number, minimum: 0 }
                        data_failures: { type: integer, minimum: 0, description: Generic upstream_unavailable responses; not proof of provider failure. }
                        overload_errors: { type: integer, minimum: 0, description: service_overloaded responses. }
                        unclassified_server_errors: { type: integer, minimum: 0, description: HTTP 5xx records without a recorded failure category, including older data. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Missing or incorrect bearer token. }
        '503': { description: Analytics disabled or storage temporarily unavailable. }
  /api/v1/status:
    get:
      tags: [System]
      summary: Check process liveness
      responses:
        '200':
          description: Process is responding; upstream providers are not checked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
              example: { status: ok, scope: process liveness }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/schools:
    get:
      tags: [Schools]
      summary: Search Comcigan schools
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 50 }
          example: 봄빛고등학교
      responses:
        '200':
          description: Matching schools.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolSearchResponse' }
              example:
                schools: [{ id: '2:봄빛고등학교', name: 봄빛고등학교, region: 서울특별시 }]
                stale: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/neis/schools:
    get:
      tags: [Schools]
      summary: Search NEIS schools
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 50 }
          example: 봄빛고등학교
      responses:
        '200':
          description: Matching NEIS schools.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NeisSchoolSearchResponse' }
              example:
                schools: [{ id: 'B10:1234567', name: 봄빛고등학교, region: 고등학교, address: 서울특별시 예시구 예시로 1 }]
                stale: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/timetable:
    get:
      tags: [Timetable]
      summary: Get a school's timetable for a week
      description: Optional filters apply to records after the shared school/week cache lookup; filters do not trigger extra upstream requests.
      parameters:
        - name: school
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' }
          example: '2:봄빛고등학교'
        - name: week
          in: query
          required: true
          description: Monday of the current or following week (Asia/Seoul).
          schema: { type: string, format: date }
          example: '2026-11-16'
        - name: grade
          in: query
          required: false
          description: Return records only for this grade.
          schema: { type: integer, minimum: 1, maximum: 6 }
        - name: class
          in: query
          required: false
          description: Return records only for this class number (can be combined with grade).
          schema: { type: integer, minimum: 1, maximum: 99 }
        - name: teacher
          in: query
          required: false
          description: Case-insensitive substring match on the teacher name, maximum 50 characters.
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '200':
          description: Timetable records for the requested week.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimetableResponse' }
              example:
                schoolId: '2:봄빛고등학교'
                weekStart: '2026-11-16'
                records: [{ grade: 1, class: 2, date: '2026-11-16', period: 1, subject: 수학, teacher: 교사A, isChanged: false }]
                sourceUpdatedAt: '2026-11-13T18:00:00+09:00'
                fetchedAt: '2026-11-14T01:00:00Z'
                stale: false
                cacheStatus: miss
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/timetable.ics:
    get:
      tags: [Timetable]
      summary: Subscribe to a rolling classroom timetable as iCalendar
      description: |-
        Returns the current week (and optionally the next week) in Asia/Seoul.
        Calendar subscribers may use the same URL across weeks. The feed uses
        the same school/week cache as the JSON timetable endpoint. Individual
        lessons default to all-day events. In timed mode, user-provided bell times
        are interpreted in Asia/Seoul and serialized as UTC instants. Missing
        periods remain explicitly labelled all-day events. Times in the URL are
        shared with the API and calendar service; no server-side profile is saved.
      parameters:
        - name: school
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' }
          example: '2:봄빛고등학교'
        - name: grade
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 6 }
        - name: class
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 99 }
        - name: teacher
          in: query
          required: false
          description: Optional case-insensitive substring filter.
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: weeks
          in: query
          required: false
          description: Number of rolling weeks to include. Default 1 to minimize upstream traffic.
          schema: { type: integer, enum: [1, 2], default: 1 }
        - name: mode
          in: query
          schema: { type: string, enum: [periods, summary, timed], default: periods }
          description: Per-lesson all-day, daily summary, or supplied bell-time events.
        - name: times
          in: query
          required: false
          description: 'Timed mode only. Comma-separated period:HHMM-HHMM entries, periods 1..20; unique periods and nonoverlapping ordered times. Example 1:0900-0950,2:1000-1050. Changing times requires replacing the subscription URL.'
          schema: { type: string, maxLength: 400 }
        - name: weekday_times
          in: query
          required: false
          description: 'Timed mode only. Comma-separated ISO weekday.period:HHMM-HHMM overrides, weekday 1=Monday through 7=Sunday. For example 2.1:1000-1050 overrides Tuesday period 1. Other periods use times. Each weekday must remain ordered and nonoverlapping after applying overrides.'
          schema: { type: string, maxLength: 2400 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: UTF-8 RFC 5545 iCalendar feed
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            text/calendar:
              schema: { type: string }
        '304':
          description: Calendar unchanged; no response body.
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/meals:
    get:
      tags: [Meals]
      summary: Get meals for a NEIS school
      parameters:
        - name: school
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Z][0-9]{2}:[0-9]{7}$' }
          example: 'B10:1234567'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-11-16'
        - name: to
          in: query
          required: true
          description: Inclusive end date; range may cover at most seven days.
          schema: { type: string, format: date }
          example: '2026-11-22'
      responses:
        '200':
          description: Meals in the requested date range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealsResponse' }
              example:
                meals: [{ date: '2026-11-16', type: 중식, dishes: [현미밥, 미역국, 과일] }]
                stale: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
  /api/v1/timetable/history.rss:
    get:
      tags: [History]
      summary: Subscribe to observed classroom changes as RSS
      description: Most recent 50 observed changes for one classroom. Defaults to the current KST week; the feed does not refresh the source timetable and may miss unobserved changes. History must be enabled.
      parameters:
        - { name: school, in: query, required: true, schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' } }
        - { name: grade, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 6 } }
        - { name: class, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 99 } }
        - { name: week, in: query, schema: { type: string, format: date }, description: Optional Monday; defaults to the current KST week. }
        - { name: subject, in: query, schema: { type: string, minLength: 1, maxLength: 50 }, description: Case-sensitive substring in either the before or after subject. }
        - { name: teacher, in: query, schema: { type: string, minLength: 1, maxLength: 50 }, description: Case-sensitive substring in either the before or after teacher. }
        - { name: weekday, in: query, schema: { type: integer, minimum: 1, maximum: 5 }, description: Monday is 1; Friday is 5. }
        - { name: period, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: type, in: query, schema: { type: string, enum: [added, deleted, changed] } }
        - { name: group, in: query, schema: { type: string, enum: [changes, daily], default: changes }, description: Group the selected latest 50 changes by lesson date. }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: RSS 2.0 feed in UTF-8.
          headers: { ETag: { schema: { type: string } } }
          content: { application/rss+xml: { schema: { type: string } } }
        '304':
          description: Feed unchanged; no response body.
          headers: { ETag: { schema: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: History disabled or storage temporarily unavailable. }
  /api/v1/timetable/history:
    get:
      tags: [History]
      summary: List observed timetable changes
      description: |-
        Returns observed changes, not a complete historical timetable. Pass
        `nextCursor` back as `cursor` to fetch the next page. History is kept
        for 30 days, and the first observation establishes a baseline.
      parameters:
        - name: school
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]+:[^:]{1,50}$' }
          example: '2:봄빛고등학교'
        - name: week
          in: query
          required: true
          description: Monday date for the timetable week.
          schema: { type: string, format: date }
          example: '2026-11-16'
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          example: '42'
      responses:
        '200':
          description: One page of observed changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryResponse' }
              example:
                changes:
                  - observedAt: '2026-11-14T01:00:00Z'
                    grade: 1
                    class: 2
                    date: '2026-11-16'
                    period: 3
                    type: changed
                    before: { subject: 과학, teacher: 교사A }
                    after: { subject: 수학, teacher: 교사A }
                nextCursor: '42'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
components:
  securitySchemes:
    WebhookManagement:
      type: http
      scheme: bearer
      description: One-time token returned when creating the individual webhook subscription.
    AnalyticsAdmin:
      type: http
      scheme: bearer
      description: Separate server-side OPENCIGAN_ANALYTICS_ADMIN_TOKEN. Never embed it in the frontend bundle.
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          description: Stable machine-readable error code; additional codes may be introduced without an API version change.
      additionalProperties: true
      example: { error: Invalid query parameter, code: invalid_request }
    Status:
      type: object
      required: [status, scope]
      properties:
        status: { const: ok }
        scope: { const: process liveness }
      additionalProperties: false
    CacheStatus:
      type: string
      description: Cache result for this response.
      enum: [hit, miss, stale]
    School:
      type: object
      required: [id, name, region]
      properties:
        id: { type: string, description: Provider-specific school identifier. }
        name: { type: string }
        region: { type: string }
        address: { type: string }
      additionalProperties: false
    SchoolSearchResponse:
      type: object
      required: [schools, stale]
      properties:
        schools: { type: array, items: { $ref: '#/components/schemas/School' } }
        stale: { type: boolean }
      additionalProperties: false
    NeisSchoolSearchResponse:
      type: object
      required: [schools, stale]
      properties:
        schools:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/School' }
              - type: object
                required: [address]
                properties: { address: { type: string } }
        stale: { type: boolean }
      additionalProperties: false
    TimetableRecord:
      type: object
      required: [grade, class, date, period, subject, teacher, isChanged]
      properties:
        grade: { type: integer, minimum: 0 }
        class: { oneOf: [{ type: integer }, { type: string }] }
        date: { type: string, format: date }
        period: { type: integer, minimum: 1 }
        subject: { type: string }
        teacher: { type: [string, 'null'] }
        isChanged: { type: boolean }
      additionalProperties: false
    TimetableResponse:
      type: object
      required: [schoolId, weekStart, records, sourceUpdatedAt, fetchedAt, stale]
      properties:
        schoolId: { type: string }
        weekStart: { type: string, format: date }
        records: { type: array, items: { $ref: '#/components/schemas/TimetableRecord' } }
        sourceUpdatedAt: { type: [string, 'null'], format: date-time }
        fetchedAt: { type: string, format: date-time }
        stale: { type: boolean }
        cacheStatus: { $ref: '#/components/schemas/CacheStatus' }
      additionalProperties: false
    Meal:
      type: object
      required: [date, type, dishes]
      properties:
        date: { type: string, format: date }
        type: { type: string }
        dishes: { type: array, items: { type: string } }
        calories: { type: [string, 'null'], maxLength: 4000, description: 'Original NEIS calorie text; no estimated value.' }
        nutrition: { type: [string, 'null'], maxLength: 4000, description: 'Original NEIS NTR_INFO text, if provided.' }
        origin: { type: [string, 'null'], maxLength: 4000, description: 'Original NEIS ingredient origin text, if provided.' }
      additionalProperties: false
    MealsResponse:
      type: object
      required: [meals, stale]
      properties:
        meals: { type: array, items: { $ref: '#/components/schemas/Meal' } }
        stale: { type: boolean }
      additionalProperties: false
    HistoryChange:
      type: object
      required: [observedAt, grade, class, date, period, type, before, after]
      properties:
        observedAt: { type: string, format: date-time }
        grade: { type: integer, minimum: 0 }
        class: { oneOf: [{ type: integer }, { type: string }] }
        date: { type: string, format: date }
        period: { type: integer, minimum: 1 }
        type: { type: string, enum: [added, deleted, changed] }
        before:
          oneOf:
            - { $ref: '#/components/schemas/SubjectTeacher' }
            - { type: 'null' }
        after:
          oneOf:
            - { $ref: '#/components/schemas/SubjectTeacher' }
            - { type: 'null' }
      additionalProperties: false
    SubjectTeacher:
      type: object
      required: [subject, teacher]
      properties:
        subject: { type: string }
        teacher: { type: string }
      additionalProperties: false
    HistoryResponse:
      type: object
      required: [changes, nextCursor]
      properties:
        changes: { type: array, items: { $ref: '#/components/schemas/HistoryChange' } }
        nextCursor: { type: [string, 'null'], description: Opaque cursor for the next page; null when exhausted. }
      additionalProperties: false
  responses:
    BadRequest:
      description: Invalid or missing query parameter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Invalid week, code: invalid_request }
    NotFound:
      description: No route matches this path.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Not found, code: not_found }
    TooManyRequests:
      description: Provider or deployment rate limit reached; retry later.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when supplied by the server.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Rate limit exceeded, code: rate_limited }
    UpstreamUnavailable:
      description: Required provider, credentials, or cache is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Upstream unavailable, code: upstream_unavailable }
