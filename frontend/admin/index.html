<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>관리자 · OpenCigan</title>
</head>
<body>
<main>
  <header><a href="/">&lt;/&gt; OpenCigan</a><h1>관리자</h1></header>
  <form id="admin-login">
    <label>관리자 토큰<input id="admin-token" type="password" autocomplete="off" required maxlength="512"></label>
    <button type="submit">잠금 해제</button>
  </form>
  <p id="admin-state" role="status" aria-live="polite"></p>
  <section id="admin-workspace" hidden aria-label="관리자 메뉴">
    <nav class="admin-navigation" aria-label="관리 메뉴">
      <button type="button" data-page="analytics" aria-pressed="true">이용 통계</button>
      <button type="button" data-page="logs" aria-pressed="false">접속 로그</button>
      <button type="button" data-page="anomalies" aria-pressed="false">이상 접근</button>
      <button type="button" data-page="history" aria-pressed="false">시간표 관측</button>
      <button type="button" data-page="schools" aria-pressed="false">학교별 조회</button>
      <button type="button" data-page="suggestions" aria-pressed="false">기능 제안</button>
      <button type="button" data-page="status" aria-pressed="false">서비스 상태</button>
      <button type="button" id="admin-lock">잠금</button>
    </nav>
    <div id="admin-content"></div>
  </section>
</main>
<script type="module" src="/src/admin-shell.ts"></script>
</body></html>
